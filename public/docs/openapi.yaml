# ==========================================
# REUSABLE COMPONENTS & SCHEMAS
# ==========================================
components:
  responses:
    NotFound:
      description: Entity not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "No query results for model [App\\Models\\Visit] 999"
    ValidationError:
      description: Form Validation Error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "The department_id field is required."
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string

  schemas:
    Department:
      type: object
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: "POLI-UMUM"
        name:
          type: string
          example: "Poliklinik Umum"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        stations:
          type: array
          items:
            $ref: "#/components/schemas/Station"

    Station:
      type: object
      properties:
        id:
          type: integer
          example: 1
        department_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Loket Registrasi 1"
        code:
          type: string
          example: "REG-01"
        type:
          type: string
          enum: [REGISTRATION, NURSE, DOCTOR, LABORATORY, PHARMACY, BILLING]
          example: "REGISTRATION"
        queue_prefix:
          type: string
          example: "A"
        is_active:
          type: boolean
          example: true

    Workflow:
      type: object
      properties:
        id:
          type: integer
          example: 1
        department_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Standard Outpatient Flow"
        is_active:
          type: boolean
          example: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"

    WorkflowStep:
      type: object
      properties:
        id:
          type: integer
          example: 1
        workflow_id:
          type: integer
          example: 1
        station_id:
          type: integer
          example: 2
        name:
          type: string
          example: "Triage & Vitals Check"
        sequence:
          type: integer
          example: 1
        is_active:
          type: boolean
          example: true
        is_optional:
          type: boolean
          example: false
        is_repeatable:
          type: boolean
          example: false
        can_skip:
          type: boolean
          example: false
        completion_requirements:
          type: object
          nullable: true

    Patient:
      type: object
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: "Budi Santoso"
        nik:
          type: string
          example: "3171012345670001"
        mrn:
          type: string
          example: "MRN-K89324"
        date_of_birth:
          type: string
          format: date
          example: "1990-05-15"
        gender:
          type: string
          example: "M"
        phone:
          type: string
          example: "081234567890"
        email:
          type: string
          example: "budi@example.com"
        address:
          type: string
          example: "Jl. Sudirman No. 10 Jakarta"

    Visit:
      type: object
      properties:
        id:
          type: integer
          example: 12
        visit_number:
          type: string
          example: "V-20261028-0001"
        patient_id:
          type: integer
          nullable: true
          example: 5
        department_id:
          type: integer
          example: 1
        workflow_id:
          type: integer
          example: 1
        intake_channel:
          type: string
          enum: [ONLINE, KIOSK, MANUAL]
          example: "KIOSK"
        status:
          type: string
          enum: [AWAITING_CHECKIN, WAITING, IN_PROGRESS, COMPLETED, CANCELLED]
          example: "WAITING"
        priority:
          type: integer
          enum: [1, 2, 3]
          example: 1
        online_active_key:
          type: string
