  /visits/{id}:
    get:
      tags:
        - 7. Visits
      summary: Get Single Visit
      description: Full deep graph of visit including patient, department, workflow, queueAcquisitions, tickets with events, and outgoing referrals.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Visit detailed object
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Visit"

  /visits/{id}/priority:
    patch:
      tags:
        - 7. Visits
      summary: Update Visit Priority
      description: Updates encounter priority (e.g. escalating to EMERGENCY) and immediately propagates the new priority to all active tickets.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - priority
              properties:
                priority:
                  type: integer
                  enum: [1, 2, 3]
                  example: 3
                user_id:
                  type: string
                  example: "Triage_Nurse_01"
      responses:
        200:
          description: Priority updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Priority updated to EMERGENCY and propagated to active tickets."
                  data:
                    $ref: "#/components/schemas/Visit"

