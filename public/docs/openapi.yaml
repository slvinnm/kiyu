    post:
      tags:
        - 7. Visits
      summary: Cancel Visit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Patient chose to reschedule"
                user_id:
                  type: string
                  example: "staff_01"
      responses:
        200:
          description: Visit cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Visit cancelled successfully."
                  data:
                    $ref: "#/components/schemas/Visit"

