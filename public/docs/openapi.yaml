            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [AWAITING_CHECKIN, WAITING, IN_PROGRESS, COMPLETED, CANCELLED]
        - name: patient_id
          in: query
          schema:
            type: integer
        - name: intake_channel
          in: query
          schema:
            type: string
            enum: [ONLINE, KIOSK, MANUAL]
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
