openapi: 3.0.3
info:
  title: Kiyu Hospital Queue & Workflow Management API
  description: |
    Comprehensive API Documentation for **Kiyu Hospital Queue System**.

    ### Overview & Architecture
    - **Intake Channels**: Kiosk, Manual (Reception Desk), Online Booking with Kiosk Check-In.
    - **Queue Phases**:
      1. Reception Queue (`QueueAcquisition` & Initial `QueueTicket` at Registration Station).
      2. Clinical Station Queue (Nurse, Doctor, Laboratory, Pharmacy, Billing).
    - **Core Entities**:
      - `Patient`: Demographics, NIK, MRN.
      - `Visit`: Encapsulates a patient encounter and workflow progression.
      - `QueueAcquisition`: Tracks initial intake claim from Kiosk/Online/Manual.
      - `QueueTicket`: Specific ticket assigned to a Station in the workflow.
      - `QueueEvent`: Immutable audit trail of ticket lifecycle events (CALLED, STARTED, HELD, etc.).
      - `Referral`: Inter-department consultation/referral flow.
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
    description: Local Development Server
  - url: http://kiyu.test/api
    description: Local Development Server via url

tags:
  - name: 1. Intake Channel
    description: Patient arrivals, kiosk tickets, and online booking check-ins
  - name: 2. Queue Acquisitions
    description: Manage and view intake acquisition records
  - name: 3. Reception & Registration
    description: Front-desk calling, skipping, and finalizing patient admission
  - name: 4. Clinical Queue Operations
    description: Calling, starting, holding, completing, skipping, transferring tickets at clinical stations
  - name: 5. Tickets
    description: Direct ticket queries and event logs
  - name: 6. Public Display
    description: Non-PII queue status for waiting room displays/TVs
  - name: 7. Visits
    description: Patient encounter lifecycle and priority management
  - name: 8. Referrals
    description: Inter-department referral creation and tracking
  - name: 9. Departments
    description: Hospital clinic/polyclinic management
  - name: 10. Stations
    description: Service counters, consultation rooms, and operational queues
  - name: 11. Workflows
    description: Multi-step routing definitions and station sequencing
  - name: 12. Patients
    description: Master patient index (NIK, MRN, contact info)
  - name: 13. Audit Logs
    description: System-wide audit trails

paths:
  # ==========================================
  # 1. INTAKE CHANNELS
  # ==========================================
  /intake/kiosk:
    post:
      tags:
        - 1. Intake Channel
      summary: Create Kiosk Walk-in Intake
      description: Generates a walk-in queue ticket at the Kiosk. Automatically attaches to the department's registration station.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - department_id
              properties:
                department_id:
                  type: integer
                  example: 1
                  description: ID of target Department
                priority:
                  type: integer
                  enum: [1, 2, 3]
                  default: 1
                  description: "1 = NORMAL, 2 = PRIORITY, 3 = EMERGENCY"
                  example: 1
                idempotency_key:
                  type: string
                  maxLength: 100
                  example: "kiosk-tx-9948271a"
                  description: Optional idempotency token to prevent double-printing
      responses:
        201:
          description: Kiosk intake created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskIntakeResponse"
        422:
          $ref: "#/components/responses/ValidationError"

  /intake/manual:
    post:
      tags:
        - 1. Intake Channel
      summary: Create Manual Walk-in Intake (Reception)
      description: Front-desk staff manually issues a ticket for patients who cannot use the kiosk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - department_id
              properties:
                department_id:
                  type: integer
                  example: 1
                priority:
                  type: integer
                  enum: [1, 2, 3]
                  default: 1
                  example: 2
                registered_by:
                  type: string
                  example: "Staff_Siti"
                  description: Username/Staff ID of the officer creating intake
                idempotency_key:
                  type: string
                  maxLength: 100
                  example: "manual-tx-88123"
      responses:
        201:
          description: Manual intake created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskIntakeResponse"
        422:
          $ref: "#/components/responses/ValidationError"

  /intake/online:
    post:
      tags:
        - 1. Intake Channel
      summary: Create Online Booking
      description: Pre-registers an existing patient online. Does NOT generate a physical queue ticket yet; generates an `online_active_key` and QR identifier for kiosk check-in upon arrival.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - patient_id
                - department_id
              properties:
                patient_id:
                  type: integer
                  example: 5
                  description: Existing Patient ID
                department_id:
                  type: integer
                  example: 1
                  description: Target Department ID
                priority:
                  type: integer
                  enum: [1, 2, 3]
                  default: 1
                  example: 1
                idempotency_key:
                  type: string
                  maxLength: 100
                  example: "online-booking-uuid-771"
      responses:
        201:
          description: Online booking created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Online booking created successfully. Patient must check in at kiosk upon arrival."
                  data:
                    type: object
                    properties:
                      visit:
                        $ref: "#/components/schemas/Visit"
                      acquisition:
                        $ref: "#/components/schemas/QueueAcquisition"
                      ticket:
                        type: object
                        nullable: true
                        example: null
        422:
          $ref: "#/components/responses/ValidationError"

  /intake/online-lookup/{identifier}:
    get:
      tags:
        - 1. Intake Channel
      summary: Preview / Lookup Online Booking
      description: Lookup an online booking by `visit_number`, `online_active_key`, or `patient MRN/NIK` on kiosk screen prior to confirming check-in.
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            type: string
          description: Visit number, online UUID key, or Patient NIK/MRN
          example: "V-20261028-0001"
      responses:
        200:
          description: Booking preview details
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Online booking preview retrieved."
                  data:
                    type: object
                    properties:
                      visit_id:
                        type: integer
                        example: 12
                      visit_number:
                        type: string
                        example: "V-20261028-0001"
                      online_active_key:
                        type: string
                        example: "9e3b4a2e-9bb4-4cf1-8316-24a9194ec710"
                      patient_name:
                        type: string
                        example: "Ahmad Dahlan"
                      patient_mrn:
                        type: string
                        example: "MRN-K89324"
                      department_name:
                        type: string
                        example: "Poli Umum"
                      status:
                        type: string
                        example: "AWAITING_CHECKIN"
                      priority:
                        type: string
                        example: "NORMAL"
        404:
          $ref: "#/components/responses/NotFound"

  /intake/online-checkin:
    post:
      tags:
        - 1. Intake Channel
      summary: Perform Kiosk Self Check-in for Online Booking
      description: Verifies booking identifier, activates the visit (`WAITING`), and generates the physical registration queue ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - booking_identifier
              properties:
                booking_identifier:
                  type: string
                  example: "9e3b4a2e-9bb4-4cf1-8316-24a9194ec710"
                  description: Online active key or Visit Number
      responses:
        200:
          description: Check-in successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Check-in successful. Patient has entered the reception queue."
                  data:
                    $ref: "#/components/schemas/KioskIntakeResponseData"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          description: Business Conflict (e.g. Visit already checked in or cancelled)

  # ==========================================
  # 2. QUEUE ACQUISITIONS
  # ==========================================
  /queue-acquisitions:
    get:
      tags:
        - 2. Queue Acquisitions
      summary: List Queue Acquisitions
      description: Filter and view intake acquisitions across channels.
      parameters:
        - name: channel
          in: query
          schema:
            type: string
            enum: [ONLINE, KIOSK, MANUAL]
        - name: status
          in: query
          schema:
            type: string
            enum: [ACQUIRED, REGISTERED, CANCELLED]
        - name: department_id
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
            format: date
            example: "2026-10-28"
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: Paginated acquisition list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAcquisition"

  /queue-acquisitions/{id}:
    get:
      tags:
        - 2. Queue Acquisitions
      summary: Get Single Acquisition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Acquisition detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Queue acquisition retrieved successfully."
                  data:
                    $ref: "#/components/schemas/QueueAcquisition"

  /queue-acquisitions/{id}/cancel:
    post:
      tags:
        - 2. Queue Acquisitions
      summary: Cancel Queue Acquisition
      description: Cancels an unprocessed acquisition (e.g., patient abandons queue before registration).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  example: "Patient left hospital"
                user_id:
                  type: string
                  example: "staff_01"
      responses:
        200:
          description: Acquisition cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Queue acquisition cancelled successfully."
                  data:
                    $ref: "#/components/schemas/QueueAcquisition"

  # ==========================================
  # 3. RECEPTION & REGISTRATION
  # ==========================================
  /reception/queue:
    get:
      tags:
        - 3. Reception & Registration
      summary: Get Reception Queue
      description: Returns all tickets currently waiting, called, or in-progress at the reception/registration counter for a department.
      parameters:
        - name: department_id
          in: query
          required: true
          schema:
            type: integer
          example: 1
        - name: station_id
          in: query
          schema:
            type: integer
          description: Optional station filter
      responses:
        200:
          description: Reception queue tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Reception queue retrieved successfully."
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/QueueTicket"

  /reception/call-next:
    post:
      tags:
        - 3. Reception & Registration
      summary: Call Next Patient at Reception
      description: Finds the highest priority waiting ticket (EMERGENCY > PRIORITY > NORMAL) and calls them to the counter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - department_id
              properties:
                department_id:
                  type: integer
                  example: 1
                station_id:
                  type: integer
                  example: 1
                assigned_to:
                  type: string
                  example: "Nurse_Ani"
      responses:
        200:
          description: Next ticket called or no tickets waiting
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Next ticket A001 called."
                  data:
                    $ref: "#/components/schemas/QueueTicket"

  /reception/complete-registration:
    post:
      tags:
        - 3. Reception & Registration
      summary: Complete Patient Registration
      description: Front desk binds patient identity (existing or new), marks acquisition REGISTERED, completes the registration ticket, and initiates Step 2 of the workflow (e.g. Nurse triage ticket).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - acquisition_id
              properties:
                acquisition_id:
                  type: integer
                  example: 1
                patient_id:
                  type: integer
                  example: 5
                  description: Optional if using existing patient
                patient_data:
                  type: object
                  description: Required if creating a new patient record
                  properties:
                    name:
                      type: string
                      example: "Budi Santoso"
                    nik:
                      type: string
                      example: "3171012345670001"
                    mrn:
                      type: string
                      example: "MRN-20261028-01"
                    date_of_birth:
                      type: string
                      format: date
                      example: "1990-05-15"
                    gender:
                      type: string
                      example: "M"
                    phone:
                      type: string
                      example: "081234567890"
                    email:
                      type: string
                      example: "budi@example.com"
                    address:
                      type: string
                      example: "Jl. Sudirman No. 10 Jakarta"
                priority:
                  type: integer
                  enum: [1, 2, 3]
                  example: 1
                registered_by:
                  type: string
                  example: "Staff_Siti"
      responses:
        200:
          description: Registration completed and next step queue ticket created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Registration completed successfully. Ticket dispatched to next workflow step."
                  data:
                    type: object
                    properties:
                      visit:
                        $ref: "#/components/schemas/Visit"
                      next_ticket:
                        $ref: "#/components/schemas/QueueTicket"
                      patient:
                        $ref: "#/components/schemas/Patient"

  /reception/{ticketId}/recall:
    post:
      tags:
        - 3. Reception & Registration
      summary: Re-call Reception Ticket
      description: Repeats the audio/display call for a ticket that is already in CALLED status.
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assigned_to:
                  type: string
                  example: "Nurse_Ani"
      responses:
        200:
          description: Ticket re-called
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Ticket A001 recalled."
                  data:
                    $ref: "#/components/schemas/QueueTicket"

  /reception/{ticketId}/skip:
    post:
      tags:
        - 3. Reception & Registration
      summary: Skip Reception Ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Patient stepped away"
                user_id:
                  type: string
                  example: "staff_01"
      responses:
        200:
          description: Ticket marked SKIPPED

  /reception/{ticketId}/no-show:
    post:
      tags:
        - 3. Reception & Registration
      summary: Mark Reception Ticket No-Show
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  example: "staff_01"
      responses:
        200:
          description: Ticket marked NO_SHOW

  # ==========================================
  # 4. CLINICAL QUEUE OPERATIONS
  # ==========================================
  /clinical/call-next:
    post:
      tags:
        - 4. Clinical Queue Operations
      summary: Call Next Patient at Clinical Station
      description: Station operator (Doctor/Nurse/Lab) calls the next waiting patient at their station.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - station_id
              properties:
                station_id:
                  type: integer
                  example: 2
                  description: Station ID
                assigned_to:
                  type: string
                  example: "Dr. Hartono"
      responses:
        200:
          description: Patient called
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Next ticket B001 called."
                  data:
                    $ref: "#/components/schemas/QueueTicket"

  /tickets/{id}/start:
    post:
      tags:
        - 4. Clinical Queue Operations
      summary: Start Service for Ticket
      description: Changes ticket status from `CALLED` to `IN_PROGRESS`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  example: "Dr. Hartono"
      responses:
        200:
          description: Service started

  /tickets/{id}/hold:
    post:
      tags:
        - 4. Clinical Queue Operations
      summary: Put Ticket On Hold
      description: Pauses service (e.g. waiting for blood test results or doctor consultation).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  example: "Waiting for lab urine test"
                user_id:
                  type: string
                  example: "Dr. Hartono"
      responses:
        200:
          description: Ticket put on hold

  /tickets/{id}/resume:
    post:
      tags:
        - 4. Clinical Queue Operations
      summary: Resume On-Hold Ticket
      description: Returns ticket to `IN_PROGRESS`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  example: "Dr. Hartono"
      responses:
        200:
          description: Ticket resumed

  /tickets/{id}/complete:
    post:
      tags:
        - 4. Clinical Queue Operations
      summary: Complete Ticket & Advance Workflow
      description: Marks current ticket COMPLETED and automatically transitions patient to the next workflow step (or completes the visit if last step).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  example: "Examination finished, prescription written"
                user_id:
                  type: string
                  example: "Dr. Hartono"
      responses:
        200:
          description: Ticket completed, next step initiated

  /tickets/{id}/recall:
    post:
      tags:
        - 4. Clinical Queue Operations
      summary: Recall Clinical Ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  example: "Dr. Hartono"
      responses:
        200:
          description: Ticket re-called

  /tickets/{id}/skip:
    post:
      tags:
        - 4. Clinical Queue Operations
      summary: Skip Ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  example: "Patient not responsive when called"
                user_id:
                  type: string
                  example: "Dr. Hartono"
      responses:
        200:
          description: Ticket skipped

  /tickets/{id}/no-show:
    post:
      tags:
        - 4. Clinical Queue Operations
      summary: Mark Ticket No-Show
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  example: "Patient did not show up after 3 calls"
                user_id:
                  type: string
                  example: "Dr. Hartono"
      responses:
        200:
          description: Ticket marked no-show

  /tickets/{id}/cancel:
    post:
      tags:
        - 4. Clinical Queue Operations
      summary: Cancel Ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  example: "Cancelled by patient request"
                user_id:
                  type: string
                  example: "Dr. Hartono"
      responses:
        200:
          description: Ticket cancelled

  /tickets/{id}/transfer:
    post:
      tags:
        - 4. Clinical Queue Operations
      summary: Transfer Ticket to Another Station
      description: Transfers patient queue to a different station, marking old ticket `TRANSFERRED` and creating a new ticket with origin linked.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - target_station_id
              properties:
                target_station_id:
                  type: integer
                  example: 3
                notes:
                  type: string
                  example: "Transferred to radiology for X-Ray check"
                user_id:
                  type: string
                  example: "Dr. Hartono"
      responses:
        200:
          description: Ticket transferred successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Ticket transferred successfully."
                  data:
                    $ref: "#/components/schemas/QueueTicket"

  # ==========================================
  # 5. TICKETS
  # ==========================================
  /tickets:
    get:
      tags:
        - 5. Tickets
      summary: List Tickets
      description: Search and filter queue tickets across all stations.
      parameters:
        - name: station_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum:
              [
                CREATED,
                CALLED,
                IN_PROGRESS,
                ON_HOLD,
                COMPLETED,
                SKIPPED,
                CANCELLED,
                NO_SHOW,
                TRANSFERRED,
              ]
        - name: visit_id
          in: query
          schema:
            type: integer
        - name: priority
          in: query
          schema:
            type: integer
            enum: [1, 2, 3]
        - name: date
          in: query
          schema:
            type: string
            format: date
            example: "2026-10-28"
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: Paginated tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTickets"

  /tickets/{id}:
    get:
      tags:
        - 5. Tickets
      summary: Get Single Ticket
      description: Complete ticket details with relations (station, workflowStep, visit.patient, events).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Ticket detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/QueueTicket"

  /tickets/{id}/events:
    get:
      tags:
        - 5. Tickets
      summary: Get Ticket Audit Events
      description: Returns timeline of state changes for the ticket (CREATED, CALLED, STARTED, COMPLETED, etc.).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: List of queue events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/QueueEvent"

  # ==========================================
  # 6. PUBLIC QUEUE DISPLAY
  # ==========================================
  /public/queue:
    get:
      tags:
        - 6. Public Display
      summary: Get Public Queue Status (No PII)
      description: Sanitized data feed for public waiting room TVs, display kiosks, or patient mobile screens. Does NOT expose patient names, NIK, or medical records.
      parameters:
        - name: station_id
          in: query
          schema:
            type: integer
          description: Filter by specific station
        - name: department_id
          in: query
          schema:
            type: integer
